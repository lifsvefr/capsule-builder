<style>
/* Layout: header with save status, sticky tabs (Palette, Pieces, Outfits), grids of drawn cards, a bottom sheet for editing. */
:root {
  --bg: #F1F1EA; --surface: #FAFAF6; --fg: #24262A; --muted: #6A6C66; --rule: #DCDBD1;
  --tile: #E7E6DD; --line: #2F2B27; --accent: #7A2E3A; --accent-ink: #FFFFFF; --scrim: rgba(20,18,16,.45); --danger: #A8261C;

}
@media (prefers-color-scheme: dark) {

}
:root[data-theme="dark"] { --bg: #18191B; --surface: #222428; --fg: #ECEAE3; --muted: #A3A49D; --rule: #34363A; --tile: #B7B4AA; --line: #1A1714; --accent: #D9848F; --accent-ink: #1A1416; --scrim: rgba(0,0,0,.6); --danger: #FF9A90; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.mast { padding-block: 24px 4px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font-family: var(--display); font-weight: 600; letter-spacing: -.01em; font-size: clamp(28px, 6vw, 40px); line-height: 1.1; margin: 0; }
.status { font-size: 12px; color: var(--muted); }
.status.warn { color: var(--danger); font-weight: 700; }

.tab { appearance: none; border: 0; background: none; font: inherit; font-weight: 700; color: var(--muted); padding: 12px 12px 10px; border-bottom: 2px solid transparent; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
main { padding-block: 20px 64px; }
h2 { font-family: var(--display); font-weight: 600; font-size: 22px; margin: 0 0 8px; }
h3 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0; }
section.block { display: grid; gap: 12px; margin-bottom: 36px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
button, select, input { font: inherit; color: inherit; }
.btn { appearance: none; border: 1px solid var(--rule); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 8px 16px; font-weight: 500; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.quiet { border-color: transparent; background: none; color: var(--accent); font-weight: 700; padding-inline: 6px; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; }
:is(.btn, .chip, .tab, .card, .sw, .typebtn, .pick, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { appearance: none; font-size: 13px; font-weight: 500; white-space: nowrap; border: 1px solid var(--rule); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.empty { border: 1px dashed var(--rule); border-radius: 8px; padding: 24px 18px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
/* palette */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.sw { appearance: none; text-align: left; border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 8px; display: grid; gap: 4px; cursor: pointer; min-width: 0; }
.sw i { display: block; height: 48px; border-radius: 5px; border: 1px solid rgba(0,0,0,.08); }
.sw b { font-weight: 500; font-size: 13px; overflow-wrap: anywhere; }
.sw span { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.seasons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.season { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
.season.hl { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.strip { display: grid; grid-template-columns: repeat(12, 1fr); height: 26px; border-radius: 4px; overflow: hidden; border: 1px solid rgba(0,0,0,.08); }
.season .row { justify-content: space-between; }
details.guide { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 12px 14px; }
details.guide summary { cursor: pointer; font-weight: 700; }
.guide-body { display: grid; gap: 14px; margin-top: 12px; max-width: 62ch; }
.q { display: grid; gap: 6px; }
.q legend { font-weight: 500; padding: 0; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.result { background: var(--tile); color: #24262A; border-radius: 6px; padding: 10px 12px; }
/* pieces */
.cat-head { font-family: var(--display); font-weight: 600; font-size: 19px; margin: 18px 0 10px; display: flex; gap: 10px; align-items: baseline; }
.cat-head small { font-family: var(--body); font-size: 12px; color: var(--muted); font-weight: 500; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 12px; }
.card { appearance: none; text-align: left; font: inherit; color: inherit; border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; min-width: 0; }
.card:hover { border-color: var(--muted); }
.art { background: var(--tile); border-radius: 5px; aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; }
.art svg { width: 86%; height: 86%; }
.ln * { stroke: var(--line); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.ln .soft { stroke-width: .8; opacity: .45; }
.ln .tex { stroke: none !important; }
.name { font-weight: 700; font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
.sub { font-size: 12px; color: var(--muted); }
/* outfits */
.outfits { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.outfit { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.outfit.idea { border-style: dashed; }
.lay { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--tile); border-radius: 5px; padding: 8px; }
.lay svg { width: 100%; height: 100%; aspect-ratio: 1; display: block; }
.outfit .row { justify-content: space-between; }
.tag { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 14px; display: grid; gap: 12px; }
label.field { display: grid; gap: 4px; font-size: 13px; font-weight: 500; min-width: 0; }
input[type="text"], input[type="url"], select { width: 100%; border: 1px solid var(--rule); background: var(--bg); border-radius: 6px; padding: 8px 10px; }
input[type="color"] { width: 44px; height: 36px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); padding: 2px; }
/* sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: min(760px, 100%); max-height: 92%; overflow-y: auto; border-radius: 14px 14px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
@media (min-width: 720px) { .scrim { align-items: center; } .sheet { border-radius: 14px; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.editor { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 640px) { .editor { grid-template-columns: 220px 1fr; } }
.preview { position: sticky; top: -18px; z-index: 3; background: var(--surface); display: flex; gap: 12px; align-items: center; padding-block: 8px; border-bottom: 1px solid var(--rule); min-width: 0; }
.preview .art { width: 92px; flex: none; }
.preview .pv-meta { min-width: 0; display: grid; gap: 2px; }
@media (min-width: 640px) { .preview { top: 0; flex-direction: column; align-items: stretch; align-self: start; border-bottom: 0; padding-block: 0; } .preview .art { width: 100%; } }
.sheet-actions { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom, 0px)); z-index: 3; background: var(--surface); border-top: 1px solid var(--rule); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; }
.sheet-actions .row { justify-content: space-between; }
.typetoggle { justify-self: start; }
.typegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; padding: 2px; }
.typebtn { appearance: none; border: 1px solid var(--rule); background: var(--bg); border-radius: 6px; padding: 4px; display: grid; gap: 2px; justify-items: center; cursor: pointer; font-size: 10.5px; line-height: 1.2; text-align: center; color: var(--fg); }
.typebtn svg { width: 44px; height: 44px; background: var(--tile); border-radius: 4px; }
.typebtn[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.colorrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pick { appearance: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(0,0,0,.3); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); cursor: pointer; padding: 0; display: grid; place-items: center; }
.pick svg { width: 20px; height: 20px; }
.pick[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.slots { display: grid; gap: 10px; }
.slot { display: grid; gap: 6px; }
.slot > span { font-size: 12px; color: var(--muted); }
.pickgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.pickgrid .card { padding: 6px; gap: 4px; }
.pickgrid .card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pickgrid .name { font-size: 12px; }
.card.wish { border-style: dashed; }
.badge { display: inline-block; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
.wearline { font-size: 12px; color: var(--fg); }
.note { font-size: 13px; font-style: italic; color: var(--fg); border-left: 2px solid var(--rule); padding-left: 8px; overflow-wrap: anywhere; }
input[type="search"], textarea { width: 100%; border: 1px solid var(--rule); background: var(--bg); border-radius: 6px; padding: 8px 10px; font: inherit; color: inherit; }
textarea { min-height: 72px; resize: vertical; }
.toolbar { display: grid; gap: 10px; }
.look { background: var(--tile); border-radius: 5px; padding: 10px; }
.flatlay { display: block; width: 100%; height: auto; max-height: 420px; }
.flatlay.compact { max-height: 280px; }
.flatlay .ln * { vector-effect: non-scaling-stroke; stroke-width: 1.4px; }
.flatlay .ln .soft { stroke-width: .7px; }
.labels { display: flex; flex-wrap: wrap; gap: 6px; }
.label { appearance: none; font: inherit; font-size: 12px; font-weight: 500; color: var(--fg); background: var(--bg); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.label[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.label:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.explain { margin: 0; }
.tips { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 10px 14px; display: grid; gap: 6px; }
.tips ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.tips b { color: var(--accent); }
.anchorbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 12px; }
.anchorbar .mini { width: 52px; height: 52px; flex: none; background: var(--tile); border-radius: 5px; display: grid; place-items: center; }
.anchorbar .mini svg { width: 90%; height: 90%; }
.anchorbar p { flex: 1; min-width: 0; margin: 0; }
.typedesc { font-size: 12.5px; color: var(--muted); margin: 0; }
.typedesc b { color: var(--fg); font-weight: 700; }
.stylegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.stylecard { gap: 10px; }
.stylecard .strip { height: 18px; }
.minirow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--tile); border-radius: 5px; padding: 6px; }
.minirow svg { width: 100%; height: auto; aspect-ratio: 1; display: block; }
.toast-btn { appearance: none; border: 0; background: none; color: inherit; font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0 0 0 12px; }
.art { position: relative; overflow: hidden; }
.art img.photo { width: 100%; height: 100%; object-fit: cover; }
.art img.refbadge { position: absolute; right: 6px; bottom: 6px; width: 30px; height: 30px; object-fit: cover; border-radius: 50%; border: 2px solid var(--surface); }
.refimg { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; border: 1px solid var(--rule); }
.lbsheet { width: min(900px, 100%); }
.lbframe { border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: #F7F5EF; }
.lbframe svg { display: block; width: 100%; height: auto; max-height: none; }
.toast { display: flex; align-items: center; gap: 4px; max-width: calc(100% - 32px); position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 13px; z-index: 30; }
.how { color: var(--fg); opacity: .8; }
.toast.top { bottom: auto; top: calc(14px + env(safe-area-inset-top, 0px)); }
.othumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.othumb { appearance: none; font: inherit; color: inherit; text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; content-visibility: auto; contain-intrinsic-size: auto 240px; }
.othumb:hover { border-color: var(--muted); }
.othumb .look { padding: 0; aspect-ratio: 4 / 5; position: relative; }
.othumb .flatlay { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); max-height: none; }
.sheet .outfit { border: 0; padding: 0; background: none; }
.othumb b { font-size: 14px; }
.othumb .sub { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.more { display: flex; justify-content: center; margin-top: 12px; }
details.fold > summary { cursor: pointer; font-weight: 700; font-size: 18px; padding: 4px 0; }
details.fold > summary .small { font-weight: 400; }
.starthere { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 14px 16px; }
.starthere ol { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 4px; }
.sheet:focus { outline: none; }
@media (prefers-reduced-motion: no-preference) { .card, .othumb { transition: border-color .15s ease; } }
</style>

<body>
<header class="mast wrap">
  <h1>Capsule Builder</h1>
  <div class="row"><span class="status" id="status" role="status" aria-live="polite">Saved in this browser</span><button class="btn quiet" data-act="settings">Settings</button></div>
</header>

<nav class="tabs" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" id="tab-palette" aria-selected="true" aria-controls="view-palette" tabindex="0" data-view="palette">Style</button>
    <button class="tab" role="tab" id="tab-pieces" aria-selected="false" aria-controls="view-pieces" tabindex="-1" data-view="pieces">Pieces</button>
    <button class="tab" role="tab" id="tab-outfits" aria-selected="false" aria-controls="view-outfits" tabindex="-1" data-view="outfits">Outfits</button>
  </div>
</nav>

<main class="wrap">
  <div id="view-palette" role="tabpanel" aria-labelledby="tab-palette"></div>
  <div id="view-pieces" role="tabpanel" aria-labelledby="tab-pieces" hidden></div>
  <div id="view-outfits" role="tabpanel" aria-labelledby="tab-outfits" hidden></div>
</main>
<div id="sheetRoot"></div>
<input type="file" id="imgInput" accept="image/*" hidden>
<input type="file" id="refInput" accept="image/*" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>

<script>

/* Renders a piece (or a type with a default fill) to SVG markup. */
function drawPiece(piece, opts = {}) {

  if (fill.kind === "solid" || !fill.kind) fillRef = fill.colors?.[0] || "#9A9C9E";
  else {
    const pd = patternDef(`p${n}`, fill);

  const td = piece.texture && piece.texture !== "none" ? textureDef(`t${n}`, piece.texture) : null;
  if (td) {

      .map(el => el.replace(/fill="__F__"/, `fill="url(#t${n})" class="tex"`)).join("");

    if (/<g transform/.test(raw)) body = raw.split(F).join(fillRef) + raw.replace(/fill="__F__"/g, `fill="url(#t${n})" class="tex"`).replace(/<(path|rect|circle|ellipse)\b(?![^>]*class="tex")[^>]*\/>/g, "");
    else body += overlay;

}

const LS_KEY = "capsule-builder-v1", LS_IMG = "capsule-builder-img-";

async function pushRemote() {

}

function setStatus(t, warn) { const el = $("#status"); if (el) { el.textContent = t; el.classList.toggle("warn", !!warn); } }
async function initRemote() {
  const C = window.claude;

  try {
    const [db, user] = await Promise.all([C.use("db"), C.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    store.db = db; store.uid = id;
    const snap = await db.doc(`data/users/${id}/wardrobe`).get();
    if (snap.exists) {
      const d = snap.data();

        lsSet(LS_KEY, JSON.stringify(state));

/* readable names for any color */
function hexToHsl(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || "")); if (!m) return null;

  return { h, s: s2, l };
}

  else if (h < 12 || h >= 345) n = l < .35 ? "burgundy" : l > .78 ? "pink" : "red";
  else if (h < 25) n = l < .4 ? "rust" : l > .78 ? "peach" : l > .6 ? "coral" : "terracotta";
  else if (h < 45) n = l < .45 ? (l < .25 ? "espresso" : "brown") : l > .84 ? (sat < .6 ? "cream" : "peach") : (l > .64 && sat < .5) ? "beige" : sat > .65 ? "orange" : "camel";
  else if (h < 65) n = l < .4 ? "olive" : l > .85 ? "cream" : sat < .45 ? "khaki" : l < .6 ? "mustard" : "yellow";
  else if (h < 90) n = l < .4 ? "olive" : l > .8 ? "pale green" : "lime";
  else if (h < 150) n = l < .3 ? "forest green" : l > .75 ? "mint" : sat < .3 ? "sage" : "green";
  else if (h < 190) n = l > .75 ? "aqua" : l < .3 ? "deep teal" : "teal";
  else if (h < 215) n = l > .75 ? "sky blue" : sat < .35 ? "slate blue" : "blue";

const SEASON_TRAITS = {
  "bright-spring": [.5, 1, 1, 2], "true-spring": [1, .7, 1, 1], "light-spring": [.5, 0, .7, 0],
  "light-summer": [-.5, 0, .3, 0], "true-summer": [-1, .8, .2, .5], "soft-summer": [-.5, 1, 0, 0],
  "soft-autumn": [.5, 1, 0, 0], "true-autumn": [1, 1.3, .3, 1], "deep-autumn": [.5, 2, .4, 1.3],

function suggestSeasons() {
  const ans = [
    { warm: 1, cool: -1, neutral: 0 }[guide.tone], { light: 0, medium: 1, deep: 2 }[guide.depth],
    { muted: 0, bright: 1 }[guide.chroma], { low: 0, medium: 1, high: 2 }[guide.contrast]

  const weights = [1, .8, 1.5, .8];
  if (ans.every(a => a === undefined)) return [];
  return Object.entries(SEASON_TRAITS)
    .map(([id, t]) => [id, ans.reduce((sum, a, i) => a === undefined ? sum : sum + weights[i] * Math.abs(a - t[i]), 0)])
    .sort((x, y) => x[1] - y[1]).slice(0, 2).map(x => x[0]);
}

const IDB = { db: null, tried: false };

    catch (e) { res(null); }

    const v = await idbGet(id);

function readImage(file, maxSide, done) {

    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height)), cv = document.createElement("canvas");

      done(cv.toDataURL("image/jpeg", 0.78));

  if (ds.docc) { readDraftInputs(); const cur = draft.occasions || []; draft.occasions = cur.includes(ds.docc) ? cur.filter(x => x !== ds.docc) : OCCASIONS.filter(x => x === ds.docc || cur.includes(x)); return renderSheet(); }

  }
  if (ds.act === "delete-piece") {
    const id = draft.id; closeSheet();
    return withUndo("Piece deleted", () => {
      state.pieces = state.pieces.filter(p => p.id !== id);
      state.outfits = state.outfits.map(o => ({ ...o, items: o.items.filter(x => x !== id) })).filter(o => o.items.length >= 2);
      ideas = ideas.filter(o => !o.items.includes(id)); if (anchorId === id) anchorId = null;
    });
  }
  if (ds.act === "duplicate") { readDraftInputs(); draft = { ...JSON.parse(JSON.stringify(draft)), id: null, name: draft.name + " (copy)", nameTouched: true }; typeOpen = false; renderSheet(); const n = $("#pieceName"); if (n) { n.focus(); n.select(); } return toast("Editing a copy. Change what's different, then add it."); }
  if (ds.fit) { readDraftInputs(); draft.fit = ds.fit; return renderSheet(); }
  if (ds.act === "ref-photo") { readDraftInputs(); return $("#refInput").click(); }
  if (ds.act === "ref-remove") { readDraftInputs(); draft.photo = ""; return renderSheet(); }

  if (ds.act === "toggle-ownedonly") { ownedOnly = !ownedOnly; ideas = []; genMsg = ""; return renderOutfits(); }

  if (ds.act === "open-starters") return openStarters();
  if (ds.sgroup) { styleGroup = ds.sgroup; return renderPalette(); }
  if (ds.style) return openStyle(ds.style);
  if (ds.stylePalette) { const id = ds.stylePalette, st = STYLE[id]; closeSheet(); return withUndo(`${st.name} palette set`, () => { state.palette = st.palette.map(([name, hex, role]) => ({ id: uidGen(), name, hex, role })); state.styleId = id; }); }
  if (ds.styleAdd) { const id = ds.styleAdd, st = STYLE[id], pcs = stylePieces(st, ds.owned === "1"); closeSheet(); show("pieces"); return withUndo(`${pcs.length} ${st.name} pieces added${ds.owned === "1" ? "" : " to your wishlist"}`, () => { state.pieces.push(...pcs); if (!state.palette.length) { state.palette = st.palette.map(([name, hex, role]) => ({ id: uidGen(), name, hex, role })); } state.styleId ||= id; }); }
  if (ds.act === "anchor") {
    const id = draft.id; closeSheet(); anchorId = id; outFilter = "All"; ideas = [];
    ideas = generate(6);
    genMsg = ideas.length ? "" : "No combinations found with this piece and these filters. Try Any season or turn off Comfy day or Only what I own.";
    show("outfits"); renderOutfits(); try { window.scrollTo({ top: 0 }); } catch (e) {} return;
  }
  if (ds.act === "clear-anchor") { anchorId = null; ideas = []; genMsg = ""; return renderOutfits(); }
  if (ds.starter) return addStarter(ds.starter, ds.owned === "1");
  if (ds.act === "generate") {
    let got = generate(6);
    /* once everything has been shown, start the rotation over instead of coming up empty */
    if (got.length < 6 && shownIdeas.size > got.length) { shownIdeas = new Set(got.map(o => clothesKey(o.items, anchorPiece()))); got = [...got, ...generate(6 - got.length)]; }
    ideas = got.length ? got : ideas;
    genMsg = !got.length ? "No new combinations found with these settings. Try a different filter, turn off Comfy day or Only what I own, or add more pieces."
      : got.length < 4 && outOcc !== "Any" ? `Only a few combinations work for ${lc(outOcc)} with these pieces. Tagging more pieces for ${lc(outOcc)} (in each piece's Occasions) gives more ideas.` : "";
    return renderOutfits();
  }
  if (ds.keep) { const o = ideas.find(x => x.id === ds.keep); ideas = ideas.filter(x => x !== o); o.num = state.nextNum++; state.outfits.push(o); save(); renderOutfits(); return toast("Outfit saved"); }
  if (ds.skip) { ideas = ideas.filter(x => x.id !== ds.skip); return renderOutfits(); }
  if (ds.openOutfit) return openOutfit(ds.openOutfit);
  if (ds.act === "more-outfits") { outLimit += 24; return renderOutfits(); }
  if (ds.act === "styles-all") { stylesAll = true; return renderPalette(); }
  if (ds.delOutfit) { const id = ds.delOutfit; closeSheet(); return withUndo("Outfit deleted", () => { state.outfits = state.outfits.filter(o => o.id !== id); }); }
  if (ds.editOutfit) { const o = state.outfits.find(x => x.id === ds.editOutfit); if (!o) return; pickerDraft = { editId: o.id, items: [...o.items], tags: Array.isArray(o[tagMode()]) ? [...o[tagMode()]] : undefined, occasion: o.occasion || "", comfy: !!o.comfy, note: o.note || "" }; return renderPicker(); }

  if (ds.act === "new-outfit") return openPicker();

  if (ds.pickp) { const d = pickerDraft; d.items = d.items.includes(ds.pickp) ? d.items.filter(x => x !== ds.pickp) : [...d.items, ds.pickp]; return renderPicker(); }
  if (ds.pseason) { const d = pickerDraft; const cur = d.tags || commonTags(piecesOf(d.items)); d.tags = cur.includes(ds.pseason) ? cur.filter(x => x !== ds.pseason) : TAGS().filter(x => x === ds.pseason || cur.includes(x)); return renderPicker(); }

}
let pendingClear = false, pendingSeason = null, pendingOutfitDel = null;
function renderPaletteConfirm() {

  if (!pendingClear) return;
  const head = $("#view-palette .block");
  head.insertAdjacentHTML("beforeend", `<div class="result">Remove every color from your palette? Your pieces keep their colors. <div class="row" style="margin-top:8px"><button class="btn danger" data-act="confirm-clear">Clear palette</button><button class="btn" data-act="cancel-clear">Cancel</button></div></div>`);
}
function renderSeasonConfirm() {
  renderPalette();
  const card = $(`[data-season-use="${pendingSeason}"]`)?.closest(".season");
  if (card) card.insertAdjacentHTML("beforeend", `<div class="result small">Replace your current palette with this one? Your pieces keep their colors. <div class="row" style="margin-top:8px"><button class="btn primary" data-act="confirm-season">Replace</button><button class="btn" data-act="cancel-season">Cancel</button></div></div>`);
}
function readDraftInputs() {
  if (!draft) return;
  const n = $("#pieceName"); if (n && n.value !== draft.name) { draft.name = n.value; draft.nameTouched = true; }
  const ps = $("#patSel"); if (ps) setPattern(ps.value);
  const tx = $("#texSel"); if (tx) draft.texture = tx.value;
  const ws = $("#wearSel"); draft.wear = ws ? ws.value : (WEAR[TYPE[draft.type].cat] || []).includes(draft.wear) ? draft.wear : "";
  const hs = $("#hemSel"); draft.hem = hs ? hs.value : TYPE[draft.type].cat === "Bottoms" ? draft.hem : "";
  const nt = $("#pieceNotes"); if (nt) draft.notes = nt.value;
  const lk = $("#pieceLink"); if (lk) draft.link = lk.value.trim();
  if (!FITS[TYPE[draft.type].cat]) draft.fit = "";
  const sd = $("#stripeDir"); if (sd) draft.fill.dir = sd.value;
  const sw = $("#stripeW"); if (sw) draft.fill.width = sw.value;
}
function setPattern(kind) {
  if (draft.fill.kind === kind) return;
  const prev = draft.fill.colors || [];
  draft.fill.kind = kind;
  const pat = PATTERNS.find(p => p.id === kind);
  const pal = state.palette.map(c => c.hex);
  const cols = [];
  pat.slots.forEach((s, i) => { cols[i] = prev[i] || (/optional/.test(s) ? "" : pal[i % Math.max(pal.length, 1)] || ["#2E3A55", "#E9DDC3", "#A4532E", "#C9A13B"][i]); });
  draft.fill.colors = cols;
}
function cleanFill(f) {

  if (f.kind === "image") { out.image = f.image; out.colors = []; }
  return out;
}
function recolor(oldHex, newHex) {
  if (oldHex.toLowerCase() === newHex.toLowerCase()) return;

}
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "patSel") { readDraftInputs(); return renderSheet(); }
  if (t.id === "texSel" || t.id === "stripeDir" || t.id === "stripeW") { readDraftInputs(); return renderSheet(); }
  if (t.dataset.slotCustom !== undefined) { readDraftInputs(); draft.fill.colors[+t.dataset.slotCustom] = t.value; return renderSheet(); }
  if (t.id === "colHex") { colorDraft.hex = t.value; const n = $("#colName"); if (n) n.placeholder = autoName(t.value); }
  if (t.id === "imgInput") return handleImage(t);
  if (t.id === "refInput") { const f = t.files && t.files[0]; t.value = ""; if (!f || !draft) return; return readImage(f, 360, src => { const id = draft.photo || uidGen(); IMAGES[id] = src; draft.photo = id; pushImage(id, src); renderSheet(); }); }

document.addEventListener("input", e => {
  if (e.target.id === "lbTitle") { state.lookbookTitle = e.target.value; save(); const f = $(".lbframe"); if (f) f.innerHTML = lbPageSVG(lbPage); }

  if (e.target.id === "typeSearch") { typeQuery = e.target.value; const g = $("#typegrid"); if (g) g.innerHTML = typeGridHTML(); const c = $("#typeCats"); if (c) c.hidden = !!typeQuery.trim(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheetRoot").innerHTML) { closeSheet(); settleFocus(null, true); } });

/* images, backup */
function handleImage(input) {
  const f = input.files && input.files[0]; input.value = "";
  if (!f || !draft) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = 220, cv = document.createElement("canvas"); cv.width = s; cv.height = s;
      const ctx = cv.getContext("2d"); const m = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      const src = cv.toDataURL("image/jpeg", 0.8);
      const id = draft.fill.image || uidGen();
      IMAGES[id] = src; draft.fill.image = id; draft.fill.kind = "image";
      pushImage(id, src); renderSheet();
    };
    img.onerror = () => toast("That file couldn't be read as an image");
    img.src = fr.result;
  };
  fr.readAsDataURL(f);
}
async function exportData() {
  const payload = JSON.stringify({ app: "capsule-builder", version: 1, state, images: IMAGES }, null, 1);
  await saveFile("capsule-wardrobe.json", payload, "Backup saved");
}
function handleImport(input) {
  const f = input.files && input.files[0]; input.value = "";
  if (!f) return;
  if (f.size > 40 * 1024 * 1024) return toast("That file is too large to be a Capsule Builder backup");
  const fr = new FileReader();
  fr.onload = () => {
    let d = null; try { d = JSON.parse(fr.result); } catch (e) {}
    if (!d || typeof d !== "object" || d.app !== "capsule-builder" || !d.state || typeof d.state !== "object") return toast("That file isn't a Capsule Builder backup, so nothing was changed");
    const next = cleanState(d.state);
    if (!next.pieces.length && !next.palette.length && !next.outfits.length) return toast("That backup is empty or damaged, so nothing was changed");
    const skipped = sArr(d.state.pieces).length - next.pieces.length + sArr(d.state.outfits).length - next.outfits.length;
    const imgs = cleanImages(d.images);
    for (const [id, src] of Object.entries(imgs)) { IMAGES[id] = src; pushImage(id, src); }
    closeSheet();
    withUndo("Backup loaded" + (skipped > 0 ? `. ${skipped} damaged item${skipped === 1 ? " was" : "s were"} skipped.` : ""), () => { state = next; });
  };
  fr.onerror = () => toast("That file couldn't be read");
  fr.readAsText(f);
}

/* another tab saved: pick up its changes instead of overwriting them later */
window.addEventListener("storage", e => {
  if (e.key !== LS_KEY || !e.newValue) return;
  try { const nv = JSON.parse(e.newValue); if ((nv.updatedAt || 0) > (state.updatedAt || 0)) { state = cleanState(nv); renderAll(); toast("Updated with changes from another tab"); } } catch (err) {}
});

/* ---------- boot ---------- */
loadLocal();
renderAll();
{ const v = lsGet("capsule-builder-view"); show(v === "pieces" || v === "outfits" ? v : (state.pieces.length ? "pieces" : "palette")); }
loadImages();
initRemote();
